name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}-${{ hashFiles('**/*.gradle*', '**/gradle/*.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run tests (unit)
        run: |
          if [ -f android/gradlew ]; then
            cd android
            chmod +x ./gradlew
            ./gradlew testDebugUnitTest --no-daemon --stacktrace
          elif [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew test --no-daemon --stacktrace
          else
            echo "No gradle wrapper found; skipping tests";
            exit 1;
          fi

      - name: Run lint
        if: success()
        run: |
          if [ -f android/gradlew ]; then
            cd android
            ./gradlew lintDebug --no-daemon --stacktrace || true
          elif [ -f ./gradlew ]; then
            ./gradlew lint --no-daemon --stacktrace || true
          fi
